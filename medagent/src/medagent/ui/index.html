        'background:#FBF3E7;border:1px solid #E0AD73;border-radius:12px;color:#2A2F3A;">' +
        '<h2 style="margin:0 0 8px;font-size:16px;color:#8E2D3D;">Console failed to load</h2>' +

        (event.message || "An unknown error occurred while loading a script or rendering the app.") +
        '</p>' +
        '<p style="margin:0;font-size:12px;opacity:0.7;">Check your internet connection (this prototype loads React, ReactDOM, Babel, and Tailwind from a CDN) and reload the page. Open the browser console for full details.</p>' +
        '</div>';
    }

</script>

<script type="text/babel" data-presets="react">
const { useState, useRef, useCallback, useEffect } = React;

/* ---------- Helpers ---------- */

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

const SEVERITY_RANK = { high: 3, moderate: 2, low: 1 };
const SEVERITY_DOT = { high: "bg-crimson-500", moderate: "bg-amber-500", low: "bg-sage-500" };
const SEVERITY_TEXT = { high: "text-crimson-600", moderate: "text-amber-700", low: "text-sage-600" };

/* ---------- Persistence ---------- */
// Prototype persists a single demo case. A multi-case app would key storage
// by case ID instead of a fixed string.
const CASE_STORAGE_KEY = "case-CXR-2026-04471";

const INITIAL_PATIENT_META = {
  caseId: "CXR-2026-04471",
  patientId: "P-88213-KX",
  age: "54",
  sex: "Female",
  viewPosition: "PA (Posteroanterior)",
};

const INITIAL_REPORT_TEXT =
`CLINICAL HISTORY
54-year-old patient presenting with productive cough, low-grade fever (38.1°C), and pleuritic chest discomfort of 3 days' duration.

TECHNIQUE
Single frontal (PA) radiograph of the chest, local diagnostic console — offline model inference.

FINDINGS
There is a focal area of airspace opacity in the right lower lobe, demonstrating ill-defined margins and mild associated volume loss. No pleural effusion identified. Cardiomediastinal silhouette is borderline enlarged. No pneumothorax. Osseous structures are unremarkable.

IMPRESSION
1. Findings most consistent with right lower lobe pneumonia (Lung Opacity). Correlate clinically with white cell count and CRP.
2. Borderline cardiothoracic ratio — recommend clinical correlation, low confidence finding.
3. Recommend follow-up radiograph in 4–6 weeks to confirm resolution.

Reviewed by: Dr. — (pending clinician sign-off)`;

/* ---------- Multi-agent pipeline ---------- */

const PIPELINE_STEPS = [
  { key: "diagnosis", label: "Diagnosis Agent", detail: "Analyzing radiograph for abnormal patterns" },
  { key: "evidence", label: "Evidence Agent", detail: "Retrieving ATS/IDSA guidelines & Semantic Scholar literature" },
  { key: "report", label: "Report Agent", detail: "Drafting structured radiology report" },
  { key: "verifier", label: "Verifier Agent", detail: "Cross-checking report against evidence and findings" },
];

/* ---------- Clinical / model data ---------- */

const FINDINGS = [
  {
    id: "f1",
    label: "Lung Opacity / Pneumonia",
    region: "Right lower lobe",
    confidence: 89,
    severity: "high",
    box: { x: 175, y: 255, w: 95, h: 90 },
    heat: { cx: 222, cy: 300, r: 68 },
    evidence: [
      {
        source: "ATS/IDSA Clinical Practice Guideline — Community-Acquired Pneumonia",
        url: "https://www.idsociety.org/practice-guideline/community-acquired-pneumonia-cap-in-adults/",
        text: "Focal consolidation with air bronchograms in a dependent lobe is treated as a classic radiographic pattern supporting a bacterial pneumonia diagnosis under the ATS/IDSA framework.",
      },
      {
        source: "Semantic Scholar — lobar consolidation literature",
        url: "https://www.semanticscholar.org/search?q=chest%20radiograph%20lobar%20consolidation%20pneumonia&sort=relevance",
        text: "A broader literature search shows Grad-CAM activation concentrated over a single lobe correlating strongly with radiologist-confirmed pneumonia across several retrospective imaging cohorts.",
      },
      {
        source: "Internal cohort (n=1,204)",
        text: "Cases with Grad-CAM activation concentrated over a single lobe showed 91% concordance with radiologist-confirmed pneumonia diagnoses in this system's local validation set.",
      },
      {
        source: "Differential note (clinical reasoning)",
        text: "Consider aspiration pneumonitis or early organizing pneumonia if symptoms persist beyond 10 days despite antibiotic therapy.",
      },
    ],
  },
  {
    id: "f2",
    label: "Mild Cardiomegaly",
    region: "Cardiac silhouette",
    confidence: 61,
    severity: "low",
    box: { x: 178, y: 235, w: 78, h: 115 },
    heat: { cx: 216, cy: 292, r: 55 },
    evidence: [
      {
        source: "Cardiothoracic ratio measurement",
        text: "Estimated CTR of 0.53 on this frontal projection, just above the conventional 0.50 upper limit of normal.",
      },
      {
        source: "Semantic Scholar — CTR reliability literature",
        url: "https://www.semanticscholar.org/search?q=cardiothoracic%20ratio%20chest%20radiograph%20reliability&sort=relevance",
        text: "Indexed literature notes borderline CTR findings in isolation often reflect patient rotation or technique rather than true cardiomegaly, and recommends correlation with echocardiography.",
      },
      {
        source: "Internal cohort (n=1,204)",
        text: "Borderline CTR findings in isolation showed lower concordance (58%) with confirmed cardiomegaly in this system's local validation set.",
      },
    ],
  },
];

/* ---------- Prior studies (historical comparison) ---------- */
// opacityLevel loosely represents how prominent the right-lower-lobe
// finding was at that point in time — used to visualize progression
// across the placeholder art when no real prior image is on file.
const PRIOR_STUDIES = [
  {
    id: "prior-1",
    label: "6 months prior",
    date: "2026-01-09",
    summary: "No acute cardiopulmonary process. Lungs clear bilaterally.",
    opacityLevel: 0,
  },
  {
    id: "prior-2",
    label: "9 days prior",
    date: "2026-07-02",
    summary: "Mild haziness at the right lung base — nonspecific, no confirmed consolidation at the time.",
    opacityLevel: 0.4,
  },
];

// Shared synthetic chest X-ray art (rib cage / lungs / heart), optionally
// with a lesion ellipse baked in to represent a prior finding's severity.
// Used for prior-study thumbnails and the comparison panel — a real build
// would render the patient's actual prior DICOM instead.
function renderSyntheticXray(opacityLevel, idSuffix) {
  const hasLesion = typeof opacityLevel === "number" && opacityLevel > 0;
  const lesionR = 18 + (opacityLevel || 0) * 55;
  const gradId = `chestGlow-thumb-${idSuffix || "default"}`;
  return (
    <svg viewBox="0 0 400 480" className="w-full h-full" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id={gradId} cx="50%" cy="42%" r="65%">
          <stop offset="0%" stopColor="#3a4150" />
          <stop offset="100%" stopColor="#14171E" />
        </radialGradient>
      </defs>
      <rect width="400" height="480" fill={`url(#${gradId})`} />
      {[...Array(9)].map((_, i) => (
        <path key={i}
          d={`M ${60 + i * 2} ${90 + i * 32} Q 200 ${70 + i * 32} ${340 - i * 2} ${90 + i * 32}`}
          stroke="#5b6472" strokeWidth="2.5" fill="none" opacity="0.55" />
      ))}
      <rect x="192" y="70" width="16" height="330" rx="6" fill="#454c59" opacity="0.7" />
      <path d="M 110 95 Q 160 78 205 88" stroke="#6b7480" strokeWidth="4" fill="none" opacity="0.6" />
      <path d="M 290 95 Q 240 78 195 88" stroke="#6b7480" strokeWidth="4" fill="none" opacity="0.6" />
      <ellipse cx="130" cy="230" rx="72" ry="150" fill="#20242e" opacity="0.75" />
      <ellipse cx="270" cy="230" rx="72" ry="150" fill="#20242e" opacity="0.75" />
      <ellipse cx="215" cy="290" rx="60" ry="75" fill="#171a21" opacity="0.85" />
      {hasLesion && (
        <ellipse cx="222" cy="300" rx={lesionR} ry={lesionR * 0.85} fill="#C7823F" opacity={0.2 + opacityLevel * 0.55} />
      )}
    </svg>
  );
}

/* ---------- Small primitives ---------- */

function ProgressRing({ value, label, tone = "amber" }) {
  const radius = 42;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference - (clamp(value, 0, 100) / 100) * circumference;
  const strokeColor = tone === "amber" ? "#C7823F" : "#5C7A5E";
  const trackColor = tone === "amber" ? "#F3E1C4" : "#DCE5DC";

  return (
    <div className="flex flex-col items-center gap-2">
      <div className="relative w-28 h-28">
        <svg className="w-28 h-28 -rotate-90" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r={radius} fill="none" stroke={trackColor} strokeWidth="9" />
          <circle
            cx="50" cy="50" r={radius} fill="none"
            stroke={strokeColor} strokeWidth="9" strokeLinecap="round"
            strokeDasharray={circumference}
            strokeDashoffset={offset}
            style={{ transition: "stroke-dashoffset 0.6s cubic-bezier(.4,0,.2,1)" }}
          />
        </svg>
        <div className="absolute inset-0 flex flex-col items-center justify-center">
          <span className="font-serif text-2xl font-semibold text-slate-850">{Math.round(value)}%</span>
        </div>
      </div>
      <span className="text-xs font-medium tracking-wide text-slate-750/70 uppercase text-center">{label}</span>
    </div>
  );
}

function Toast({ toast }) {
  if (!toast) return null;
  const palette = {
    success: { bg: "bg-sage-600", ring: "ring-sage-500/30" },
    neutral: { bg: "bg-slate-750", ring: "ring-slate-750/30" },
    danger:  { bg: "bg-crimson-600", ring: "ring-crimson-500/30" },
  }[toast.tone];

  return (
    <div className="fixed bottom-24 right-6 z-50 toast-enter">
      <div className={`${palette.bg} text-cream-50 px-5 py-3.5 rounded-xl shadow-floating ring-4 ${palette.ring} max-w-sm`}>
        <p className="text-sm font-semibold leading-snug">{toast.title}</p>
        {toast.body && <p className="text-xs text-cream-50/80 mt-0.5 leading-snug">{toast.body}</p>}
      </div>
    </div>
  );
}

function ConfirmModal({ pendingAction, onConfirm, onCancel }) {
  const confirmBtnRef = useRef(null);

  useEffect(() => {
    if (!pendingAction) return;
    if (confirmBtnRef.current) confirmBtnRef.current.focus();
    const handleKey = (e) => { if (e.key === "Escape") onCancel(); };
    window.addEventListener("keydown", handleKey);
    return () => window.removeEventListener("keydown", handleKey);
  }, [pendingAction, onCancel]);

  if (!pendingAction) return null;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/50 px-4" onClick={onCancel} role="presentation">
      <div role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title"
        className="bg-cream-50 rounded-2xl shadow-floating border border-amber-100 max-w-sm w-full p-5"
        onClick={(e) => e.stopPropagation()}>
        <h3 id="confirm-modal-title" className="font-serif text-lg font-semibold text-slate-850 mb-2">
          Approve &amp; finalize this case?
        </h3>
        <p className="text-sm text-slate-750/75 leading-relaxed mb-5">
          This signs the report as final and commits it to the local case record. You can still edit the draft afterward, but the case will be marked Finalized.
        </p>
        <div className="flex justify-end gap-2">
          <button onClick={onCancel}
            className="px-4 py-2 rounded-lg text-sm font-semibold bg-cream-100 text-slate-750 border border-amber-100 hover:bg-amber-50 transition-colors">
            Keep Reviewing
          </button>
          <button ref={confirmBtnRef} onClick={onConfirm}
            className="px-4 py-2 rounded-lg text-sm font-semibold text-cream-50 shadow-sm transition-colors bg-sage-500 hover:bg-sage-600">
            Approve &amp; Finalize
          </button>
        </div>
      </div>
    </div>
  );
}

const FEEDBACK_CONFIG = {
  reject: {
    title: "Why is this being rejected?",
    subtitle: "Sent to the backend orchestrator so it can log the feedback and route this case for secondary review.",
    placeholder: "e.g. Missed a small apical nodule; the bounding box location looks off; disagree with the severity rating…",
    submitLabel: "Submit & Archive Case",
    submitClass: "bg-crimson-500 hover:bg-crimson-600",
  },
  revise: {
    title: "What did the AI miss or get wrong?",
    subtitle: "Sent back to the Report Agent, which will attempt a revision and re-run verification.",
    placeholder: "e.g. Please note the borderline cardiomegaly more prominently; soften the certainty of the pneumonia impression…",
    submitLabel: "Send to Report Agent",
    submitClass: "bg-amber-500 hover:bg-amber-600",
  },
};

function FeedbackModal({ requestType, value, onChange, onSubmit, onCancel }) {
  const textareaRef = useRef(null);
  const [touched, setTouched] = useState(false);

  useEffect(() => {
    if (!requestType) { setTouched(false); return; }
    if (textareaRef.current) textareaRef.current.focus();
    const handleKey = (e) => { if (e.key === "Escape") onCancel(); };
    window.addEventListener("keydown", handleKey);
    return () => window.removeEventListener("keydown", handleKey);
  }, [requestType, onCancel]);

  if (!requestType) return null;
  const config = FEEDBACK_CONFIG[requestType];
  const trimmed = value.trim();
  const isEmpty = trimmed.length === 0;

  const handleSubmit = () => {
    if (isEmpty) { setTouched(true); return; }
    onSubmit(trimmed);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/50 px-4" onClick={onCancel} role="presentation">
      <div role="dialog" aria-modal="true" aria-labelledby="feedback-modal-title"
        className="bg-cream-50 rounded-2xl shadow-floating border border-amber-100 max-w-md w-full p-5"
        onClick={(e) => e.stopPropagation()}>
        <h3 id="feedback-modal-title" className="font-serif text-lg font-semibold text-slate-850 mb-1.5">
          {config.title}
        </h3>
        <p className="text-xs text-slate-750/60 leading-relaxed mb-4">{config.subtitle}</p>
        <textarea
          ref={textareaRef}
          value={value}
          onChange={(e) => onChange(e.target.value)}
          onBlur={() => setTouched(true)}
          placeholder={config.placeholder}
          rows={4}
          className={`w-full bg-cream-100/60 border rounded-xl px-3.5 py-3 text-sm leading-relaxed text-slate-850 focus:ring-2 focus:ring-amber-300 resize-none
            ${touched && isEmpty ? "border-crimson-500/50" : "border-amber-100 focus:border-amber-300"}`}
        />
        {touched && isEmpty && (
          <p className="text-xs text-crimson-600 mt-1.5">Please describe your feedback before submitting.</p>
        )}
        <div className="flex justify-end gap-2 mt-4">
          <button onClick={onCancel}
            className="px-4 py-2 rounded-lg text-sm font-semibold bg-cream-100 text-slate-750 border border-amber-100 hover:bg-amber-50 transition-colors">
            Cancel
          </button>
          <button onClick={handleSubmit}
            disabled={isEmpty}
            className={`px-4 py-2 rounded-lg text-sm font-semibold text-cream-50 shadow-sm transition-colors ${config.submitClass} ${isEmpty ? "opacity-50 cursor-not-allowed" : ""}`}>
            {config.submitLabel}
          </button>
        </div>
      </div>
    </div>
  );
}

function PipelineTracker({ stepStatuses, running, onRerun }) {
  return (
    <div className="bg-cream-50 rounded-2xl shadow-card border border-amber-100 p-4">
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <h2 className="text-xs font-semibold uppercase tracking-wide text-slate-750/60">Agent Pipeline</h2>
        <button
          onClick={onRerun}
          disabled={running}
          className={`text-xs font-semibold px-2.5 py-1 rounded-md border transition-colors ${
            running ? "opacity-40 cursor-not-allowed border-amber-100 text-slate-750/40" : "border-amber-200 text-amber-700 hover:bg-amber-50"
          }`}
        >
          {running ? "Running…" : "Re-run Full Pipeline"}
        </button>
      </div>
      <div className="flex items-start gap-1.5 sm:gap-3">
        {PIPELINE_STEPS.map((step, idx) => {
          const status = stepStatuses[idx];
          return (
            <React.Fragment key={step.key}>
              <div className="flex flex-col items-center text-center flex-1 min-w-0">
                <div className={`relative w-8 h-8 rounded-full flex items-center justify-center border-2 shrink-0 ${
                  status === "done" ? "bg-sage-500 border-sage-500"
                    : status === "active" ? "border-amber-500 bg-amber-50"
                    : "border-amber-100 bg-cream-100"
                }`}>
                  {status === "done" && (
                    <svg className="w-4 h-4 text-cream-50" viewBox="0 0 20 20" fill="currentColor">
                      <path fillRule="evenodd" d="M16.7 5.3a1 1 0 010 1.4l-7.4 7.4a1 1 0 01-1.4 0L3.3 9.5a1 1 0 111.4-1.4l3.9 3.9 6.7-6.7a1 1 0 011.4 0z" clipRule="evenodd" />
                    </svg>
                  )}
                  {status === "active" && <span className="absolute w-3 h-3 rounded-full bg-amber-500 animate-ping"></span>}
                  {status === "active" && <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span>}
                  {status === "pending" && <span className="w-2 h-2 rounded-full bg-amber-200"></span>}
                </div>
                <p className={`text-xs font-semibold mt-1.5 ${status === "pending" ? "text-slate-750/40" : "text-slate-850"}`}>
                  {step.label}
                </p>
                <p className={`text-[11px] mt-0.5 leading-snug ${status === "active" ? "text-amber-700" : "text-slate-750/45"}`}>
                  {status === "active" ? `${step.detail}…` : status === "done" ? "Complete" : "Waiting"}
                </p>
              </div>
              {idx < PIPELINE_STEPS.length - 1 && (
                <div className={`h-0.5 flex-1 mt-4 rounded-full transition-colors ${status === "done" ? "bg-sage-400" : "bg-amber-100"}`}></div>
              )}
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- Main App ---------- */

function App() {
  const [activeView, setActiveView] = useState("original"); // original | bbox | gradcam
  const [dragActive, setDragActive] = useState(false);
  const [fileName, setFileName] = useState(null);
  const [imageUrl, setImageUrl] = useState(null);
  const [toast, setToast] = useState(null);
  const [caseStatus, setCaseStatus] = useState(null); // null | approved | rejected

  // Viewer controls
  const [zoom, setZoom] = useState(1);
  const [pan, setPan] = useState({ x: 0, y: 0 });
  const [isDragging, setIsDragging] = useState(false);
  const [brightness, setBrightness] = useState(100);
  const [contrast, setContrast] = useState(100);
  const [heatmapOpacity, setHeatmapOpacity] = useState(70);
  const [comparisonStudyId, setComparisonStudyId] = useState(null);

  // Clinical / AI state
  const [confidenceThreshold, setConfidenceThreshold] = useState(50);
  const [selectedFindingId, setSelectedFindingId] = useState(null);
  const [runTimestamp] = useState(() => new Date());
  const [patientMeta, setPatientMeta] = useState(INITIAL_PATIENT_META);
  const [reportText, setReportText] = useState(INITIAL_REPORT_TEXT);

  // Confirmation modal for the finalize action
  const [pendingAction, setPendingAction] = useState(null); // null | "approve"

  // Human-feedback modal for reject / revise
  const [feedbackRequest, setFeedbackRequest] = useState(null); // null | "reject" | "revise"
  const [feedbackText, setFeedbackText] = useState("");
  const [feedbackLog, setFeedbackLog] = useState([]); // [{id, type, reason, timestamp}]

  // Multi-agent pipeline status
  const [stepStatuses, setStepStatuses] = useState(PIPELINE_STEPS.map(() => "pending"));
  const [pipelineRunning, setPipelineRunning] = useState(false);
  const pipelineTimerRef = useRef(null);

  // Persistence
  const [storageStatus, setStorageStatus] = useState("checking"); // checking | available | unavailable
  const [saveState, setSaveState] = useState("idle"); // idle | saving | saved | error
  const [lastSavedAt, setLastSavedAt] = useState(null);
  const hasHydratedRef = useRef(false);
  const saveTimerRef = useRef(null);

  const fileInputRef = useRef(null);
  const prevUrlRef = useRef(null);
  const dragOrigin = useRef({ x: 0, y: 0 });
  const panOrigin = useRef({ x: 0, y: 0 });

  const showToast = useCallback((title, body, tone = "neutral") => {
    setToast({ title, body, tone });
    window.clearTimeout(showToast._t);
    showToast._t = window.setTimeout(() => setToast(null), 3200);
  }, []);

  /* ---- Multi-agent pipeline: animates stepStatuses through a range ---- */
  const runPipeline = useCallback((startIdx, endIdx, onDone) => {
    window.clearTimeout(pipelineTimerRef.current);
    setPipelineRunning(true);
    setStepStatuses((prev) => prev.map((s, i) => (i < startIdx ? "done" : i <= endIdx ? "pending" : s)));

    let i = startIdx;
    const advance = () => {
      setStepStatuses((prev) => prev.map((s, idx) => (idx === i ? "active" : idx < i ? "done" : s)));
      pipelineTimerRef.current = window.setTimeout(() => {
        setStepStatuses((prev) => prev.map((s, idx) => (idx === i ? "done" : s)));
        i += 1;
        if (i <= endIdx) {
          advance();
        } else {
          setPipelineRunning(false);
          if (onDone) onDone();
        }
      }, 900);
    };
    advance();
  }, []);

  // Simulate the initial pipeline run so the clinician can watch the
  // reasoning trace instead of seeing results appear instantly.
  useEffect(() => {
    runPipeline(0, PIPELINE_STEPS.length - 1);
    return () => window.clearTimeout(pipelineTimerRef.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  /* ---- Hydrate saved case state on mount ---- */
  useEffect(() => {
    let cancelled = false;
    async function hydrate() {
      if (typeof window.storage === "undefined") {
        if (!cancelled) setStorageStatus("unavailable");
        hasHydratedRef.current = true;
        return;
      }
      try {
        const result = await window.storage.get(CASE_STORAGE_KEY, false);
        if (!cancelled && result && result.value) {
          const saved = JSON.parse(result.value);
          if (saved.patientMeta) setPatientMeta(saved.patientMeta);
          if (typeof saved.reportText === "string") setReportText(saved.reportText);
          if (saved.caseStatus !== undefined) setCaseStatus(saved.caseStatus);
          if (typeof saved.confidenceThreshold === "number") setConfidenceThreshold(saved.confidenceThreshold);
          if (saved.selectedFindingId !== undefined) setSelectedFindingId(saved.selectedFindingId);
          if (Array.isArray(saved.feedbackLog)) setFeedbackLog(saved.feedbackLog);
          if (saved.savedAt) setLastSavedAt(new Date(saved.savedAt));
          showToast("Draft restored", "Loaded your saved report and case state from last session.", "neutral");
        }
      } catch (e) {
        // No saved key yet (first run) — nothing to hydrate, that's fine.
      } finally {
        if (!cancelled) setStorageStatus("available");
        hasHydratedRef.current = true;
      }
    }
    hydrate();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  /* ---- Debounced autosave whenever case state changes ---- */
  useEffect(() => {
    if (!hasHydratedRef.current || storageStatus !== "available") return;
    setSaveState("saving");
    if (saveTimerRef.current) window.clearTimeout(saveTimerRef.current);
    saveTimerRef.current = window.setTimeout(async () => {
      try {
        const payload = {
          patientMeta, reportText, caseStatus, confidenceThreshold, selectedFindingId, feedbackLog,
          savedAt: new Date().toISOString(),
        };
        const result = await window.storage.set(CASE_STORAGE_KEY, JSON.stringify(payload), false);
        if (result) {
          setSaveState("saved");
          setLastSavedAt(new Date());
        } else {
          setSaveState("error");
        }
      } catch (e) {
        setSaveState("error");
      }
    }, 600);
    return () => window.clearTimeout(saveTimerRef.current);
  }, [patientMeta, reportText, caseStatus, confidenceThreshold, selectedFindingId, feedbackLog, storageStatus]);

  const handleClearSavedData = async () => {
    setPatientMeta(INITIAL_PATIENT_META);
    setReportText(INITIAL_REPORT_TEXT);
    setCaseStatus(null);
    setConfidenceThreshold(50);
    setSelectedFindingId(null);
    setFeedbackLog([]);
    setLastSavedAt(null);
    setSaveState("idle");
    if (storageStatus === "available" && typeof window.storage !== "undefined") {
      try { await window.storage.delete(CASE_STORAGE_KEY, false); } catch (e) { /* nothing saved yet */ }
    }
    showToast("Saved draft cleared", "Case data reset to the original template.", "neutral");
  };

  const getSaveLabel = () => {
    if (storageStatus === "checking") return "Checking for a saved draft…";
    if (storageStatus === "unavailable") return "Session only — won't be saved after refresh";
    if (saveState === "saving") return "Saving…";
    if (saveState === "error") return "Save failed — storage unavailable";
    if (lastSavedAt) return `Saved ${lastSavedAt.toLocaleTimeString()}`;
    return "Autosaved locally";
  };

  const getSaveLabelClass = () => {
    if (storageStatus === "unavailable" || saveState === "error") return "text-crimson-600/70";
    if (saveState === "saving" || storageStatus === "checking") return "text-amber-700";
    if (saveState === "saved") return "text-sage-600/70";
    return "text-slate-750/50";
  };

  const handleConfirmAction = () => {
    setCaseStatus("approved");
    showToast("Report finalized", "Signed and committed to the local case record.", "success");
    setPendingAction(null);
  };

  /* ---- Human-feedback modal (reject / revise) ---- */
  const handleSubmitFeedback = (reasonText) => {
    const entry = {
      id: Date.now(),
      type: feedbackRequest, // "reject" | "revise"
      reason: reasonText,
      timestamp: new Date().toISOString(),
    };
    setFeedbackLog((prev) => [...prev, entry]);

    if (feedbackRequest === "reject") {
      setCaseStatus("rejected");
      showToast("Case archived", "Feedback logged and sent to the orchestrator for secondary review.", "danger");
    } else if (feedbackRequest === "revise") {
      // Simulate the backend routing feedback to the Report Agent, which
      // re-drafts and the Verifier Agent re-checks the result.
      runPipeline(2, PIPELINE_STEPS.length - 1, () => {
        showToast("Revision cycle complete", "Report Agent re-drafted and Verifier Agent re-checked based on your feedback.", "neutral");
      });
      showToast("Feedback sent", "Your notes were routed to the Report Agent.", "neutral");
    }
    setFeedbackRequest(null);
    setFeedbackText("");
  };

  const handleCancelFeedback = () => {
    setFeedbackRequest(null);
    setFeedbackText("");
  };

  /* ---- Findings derived state ---- */
  const visibleFindings = FINDINGS.filter((f) => f.confidence >= confidenceThreshold);
  const sortedBySeverity = [...FINDINGS].sort(
    (a, b) => SEVERITY_RANK[b.severity] - SEVERITY_RANK[a.severity] || b.confidence - a.confidence
  );
  const primaryFinding = sortedBySeverity.find((f) => f.confidence >= confidenceThreshold) || null;
  const activeFinding =
    FINDINGS.find((f) => f.id === selectedFindingId) || primaryFinding || FINDINGS[0];
  // Findings drawn on the canvas: anything above threshold, plus whatever is
  // explicitly selected (so a borderline finding can still be inspected).
  const canvasFindings = FINDINGS.filter(
    (f) => f.confidence >= confidenceThreshold || f.id === selectedFindingId
  );
  const comparisonStudy = PRIOR_STUDIES.find((s) => s.id === comparisonStudyId) || null;

  /* ---- File handling ---- */
  const loadFile = useCallback((file) => {
    if (!file) return;
    const url = URL.createObjectURL(file);
    if (prevUrlRef.current) URL.revokeObjectURL(prevUrlRef.current);
    prevUrlRef.current = url;
    setImageUrl(url);
    setFileName(file.name);
    setZoom(1);
    setPan({ x: 0, y: 0 });
    showToast("Image loaded", `${file.name} attached to case.`, "success");
  }, [showToast]);

  const handleDrop = useCallback((e) => {
    e.preventDefault();
    setDragActive(false);
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    loadFile(file);
  }, [loadFile]);

  const handleFilePick = (e) => {
    const file = e.target.files && e.target.files[0];
    loadFile(file);
  };

  /* ---- Viewer interactions ---- */
  const handleWheel = (e) => {
    e.preventDefault();
    setZoom((z) => clamp(+(z - e.deltaY * 0.001).toFixed(2), 0.5, 3));
  };
  const handleMouseDown = (e) => {
    if (zoom <= 1) return;
    setIsDragging(true);
    dragOrigin.current = { x: e.clientX, y: e.clientY };
    panOrigin.current = { ...pan };
  };
  const handleMouseMove = (e) => {
    if (!isDragging) return;
    const dx = e.clientX - dragOrigin.current.x;
    const dy = e.clientY - dragOrigin.current.y;
    setPan({ x: panOrigin.current.x + dx, y: panOrigin.current.y + dy });
  };
  const handleMouseUp = () => setIsDragging(false);
  const resetView = () => { setZoom(1); setPan({ x: 0, y: 0 }); };
  const resetWindowLevel = () => { setBrightness(100); setContrast(100); };

  const insertFindingsSummary = () => {
    if (visibleFindings.length === 0) {
      showToast("Nothing to insert", "No findings are currently above the confidence threshold.", "neutral");
      return;
    }
    const lines = visibleFindings
      .map((f) => `- ${f.label} (${f.region}): confidence ${f.confidence}%, severity ${f.severity}`)
      .join("\n");
    setReportText((prev) => `${prev}\n\nSTRUCTURED FINDINGS SUMMARY (auto-generated)\n${lines}\n`);
    showToast("Findings inserted", "Structured summary appended to the report draft.", "neutral");
  };

  const viewTabs = [
    { key: "original", label: "Original Image" },
    { key: "bbox", label: "Show Bounding Boxes" },
    { key: "gradcam", label: "Show Grad-CAM Heatmap" },
  ];

  /* ---- Base image layer (uploaded file, or an illustrative placeholder) ---- */
  function renderBase() {
    const filterStyle = { filter: `brightness(${brightness}%) contrast(${contrast}%)` };
    if (imageUrl) {
      return (
        <img
          src={imageUrl}
          alt="Uploaded chest X-ray"
          draggable="false"
          className="w-full h-full object-contain select-none"
          style={filterStyle}
        />
      );
    }
    return (
      <svg viewBox="0 0 400 480" className="w-full h-full object-contain" style={filterStyle} preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="chestGlow" cx="50%" cy="42%" r="65%">
            <stop offset="0%" stopColor="#3a4150" />
            <stop offset="100%" stopColor="#14171E" />
          </radialGradient>
        </defs>
        <rect width="400" height="480" fill="url(#chestGlow)" />
        {[...Array(9)].map((_, i) => (
          <path key={i}
            d={`M ${60 + i * 2} ${90 + i * 32} Q 200 ${70 + i * 32} ${340 - i * 2} ${90 + i * 32}`}
            stroke="#5b6472" strokeWidth="2.5" fill="none" opacity="0.55" />
        ))}
        <rect x="192" y="70" width="16" height="330" rx="6" fill="#454c59" opacity="0.7" />
        <path d="M 110 95 Q 160 78 205 88" stroke="#6b7480" strokeWidth="4" fill="none" opacity="0.6" />
        <path d="M 290 95 Q 240 78 195 88" stroke="#6b7480" strokeWidth="4" fill="none" opacity="0.6" />
        <ellipse cx="130" cy="230" rx="72" ry="150" fill="#20242e" opacity="0.75" />
        <ellipse cx="270" cy="230" rx="72" ry="150" fill="#20242e" opacity="0.75" />
        <ellipse cx="215" cy="290" rx="60" ry="75" fill="#171a21" opacity="0.85" />
      </svg>
    );
  }

  /* ---- Zoomable/pannable current-image viewer (base + findings overlay) ---- */
  /* Reused by both the single-panel view and the side-by-side comparison view. */
  function renderInteractiveViewer() {
    return (
      <div
        className="w-full h-full flex items-center justify-center"
        style={{ cursor: zoom > 1 ? (isDragging ? "grabbing" : "grab") : "default" }}
        onMouseDown={handleMouseDown}
        onMouseMove={handleMouseMove}
        onMouseUp={handleMouseUp}
        onMouseLeave={handleMouseUp}
      >
        <div
          className="relative w-full h-full max-h-[560px]"
          style={{
            transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`,
            transition: isDragging ? "none" : "transform 0.15s ease-out",
          }}
        >
          {renderBase()}

          <svg
            viewBox="0 0 400 480"
            preserveAspectRatio="xMidYMid meet"
            className="absolute inset-0 w-full h-full"
            style={{ pointerEvents: "none" }}
          >
            {activeView === "bbox" && canvasFindings.map((f) => {
              const isSelected = activeFinding && activeFinding.id === f.id;
              const below = f.confidence < confidenceThreshold;
              return (
                <g key={f.id}
                  onClick={() => setSelectedFindingId(f.id)}
                  className={isSelected ? "box-selected" : ""}
                  style={{ cursor: "pointer", pointerEvents: "visiblePainted" }}
                >
                  <rect x={f.box.x} y={f.box.y} width={f.box.w} height={f.box.h} rx="4" fill="none"
                    stroke={isSelected ? "#E0413A" : "#C7823F"}
                    strokeWidth={isSelected ? 3.5 : 2.5}
                    strokeDasharray={below ? "3 3" : "6 3"}
                    opacity={below ? 0.6 : 1} />
                  <text x={f.box.x + 3} y={f.box.y - 8}
                    fill={isSelected ? "#E0413A" : "#E0AD73"} fontSize="12"
                    fontFamily="IBM Plex Mono, monospace">
                    {f.label} · {f.confidence}%{below ? " (below threshold)" : ""}
                  </text>
                </g>
              );
            })}

            {activeView === "gradcam" && canvasFindings.map((f) => {
              const isSelected = activeFinding && activeFinding.id === f.id;
              return (
                <g key={f.id}
                  onClick={() => setSelectedFindingId(f.id)}
                  style={{ cursor: "pointer", pointerEvents: "visiblePainted" }}
                  opacity={heatmapOpacity / 100}
                >
                  <defs>
                    <radialGradient id={`heat-${f.id}`} cx="50%" cy="50%" r="50%">
                      <stop offset="0%" stopColor="#E0413A" stopOpacity={isSelected ? 1 : 0.85} />
                      <stop offset="45%" stopColor="#E0AD73" stopOpacity="0.65" />
                      <stop offset="100%" stopColor="#E0AD73" stopOpacity="0" />
                    </radialGradient>
                  </defs>
                  <ellipse cx={f.heat.cx} cy={f.heat.cy} rx={f.heat.r} ry={f.heat.r * 0.9} fill={`url(#heat-${f.id})`} />
                  {isSelected && (
                    <ellipse cx={f.heat.cx} cy={f.heat.cy} rx={f.heat.r} ry={f.heat.r * 0.9}
                      fill="none" stroke="#E0413A" strokeWidth="1.5" strokeDasharray="3 2" />
                  )}
                </g>
              );
            })}
          </svg>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-cream-100 text-slate-750">

      {/* ---------------- HEADER ---------------- */}
      <header className="sticky top-0 z-30 bg-cream-50/90 backdrop-blur border-b border-amber-100">
        <div className="max-w-[1600px] mx-auto px-6 py-3.5 flex items-center justify-between gap-4 flex-wrap">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-lg bg-slate-850 flex items-center justify-center shrink-0">
              <span className="text-amber-300 font-serif font-semibold text-base">Rx</span>
            </div>
            <div className="leading-tight">
              <h1 className="font-serif text-lg font-semibold text-slate-850 tracking-tight">Radiograph Review Console</h1>
              <p className="text-[11px] text-slate-750/60 font-medium tracking-wide uppercase">Diagnostic Imaging · Decision Support</p>
            </div>
          </div>

          <div className="flex items-center gap-3">
            <span className="inline-flex items-center gap-1.5 bg-sage-500/10 text-sage-600 border border-sage-500/25 px-3 py-1.5 rounded-full text-xs font-semibold">
              <span className="w-1.5 h-1.5 rounded-full bg-sage-500"></span>
              Local Mode (Offline)
            </span>
            <div className="flex items-center gap-2 pl-3 border-l border-amber-100">
              <div className="w-8 h-8 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center font-serif font-semibold text-sm">
                DK
              </div>
              <div className="leading-tight hidden sm:block">
                <p className="text-sm font-semibold text-slate-850">Dr. A. Kessler</p>
                <p className="text-[11px] text-slate-750/55">Attending Radiologist</p>
              </div>
            </div>
          </div>
        </div>
      </header>

      {/* ---------------- MAIN GRID ---------------- */}
      <main className="max-w-[1600px] mx-auto px-6 py-6 grid grid-cols-1 lg:grid-cols-[280px_1fr_320px] gap-5 pb-32">

        {/* ---------- AGENT PIPELINE STATUS ---------- */}
        <section className="col-span-1 lg:col-span-3 order-0">
          <PipelineTracker
            stepStatuses={stepStatuses}
            running={pipelineRunning}
            onRerun={() => runPipeline(0, PIPELINE_STEPS.length - 1)}
          />
        </section>

        {/* ---------- LEFT SIDEBAR ---------- */}
        <aside className="flex flex-col gap-5 order-1">

          <div className="bg-cream-50 rounded-2xl shadow-card border border-amber-100 p-4">
            <h2 className="text-xs font-semibold uppercase tracking-wide text-slate-750/60 mb-3">Study Upload</h2>
            <div
              onDragOver={(e) => { e.preventDefault(); setDragActive(true); }}
              onDragLeave={() => setDragActive(false)}
              onDrop={handleDrop}
              onClick={() => fileInputRef.current && fileInputRef.current.click()}
              className={`border-2 border-dashed border-amber-200 rounded-xl py-8 px-3 flex flex-col items-center justify-center text-center cursor-pointer transition-colors ${dragActive ? "dropzone-active" : "hover:bg-amber-50/60"}`}
            >
              <svg xmlns="http://www.w3.org/2000/svg" className="w-8 h-8 text-amber-500 mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6">
                <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M7 9l5-5 5 5M12 4v13" />
              </svg>
              <p className="text-sm font-medium text-slate-850">Drop an X-ray image</p>
              <p className="text-xs text-slate-750/55 mt-1">or click to browse — .png, .jpg (DICOM parsing not included in this prototype)</p>
              {fileName && (
                <p className="mt-3 text-xs font-mono bg-amber-100 text-amber-700 px-2 py-1 rounded-md truncate max-w-full">
                  {fileName}
                </p>
              )}
            </div>
            <input ref={fileInputRef} type="file" className="hidden" onChange={handleFilePick} accept="image/*" />
          </div>

          <div className="bg-cream-50 rounded-2xl shadow-card border border-amber-100 p-4">
            <h2 className="text-xs font-semibold uppercase tracking-wide text-slate-750/60 mb-3">Patient Metadata</h2>
            <div className="flex flex-col gap-3">
              {[
                { key: "caseId", label: "Case ID", mono: true },
                { key: "patientId", label: "Patient ID", mono: true },
                { key: "age", label: "Age" },
                { key: "sex", label: "Sex" },
                { key: "viewPosition", label: "View Position" },
              ].map((field) => (
                <label key={field.key} className="block">
                  <span className="text-[11px] font-medium text-slate-750/55 uppercase tracking-wide">{field.label}</span>
                  <input
                    value={patientMeta[field.key]}
                    onChange={(e) => setPatientMeta((prev) => ({ ...prev, [field.key]: e.target.value }))}
                    className={`mt-1 w-full bg-cream-100/70 border border-amber-100 rounded-lg px-3 py-2 text-sm text-slate-850 focus:outline-none focus:ring-2 focus:ring-amber-300 focus:border-amber-300 ${field.mono ? "font-mono" : ""}`}
                  />
                </label>
              ))}
            </div>
          </div>

          {/* Prior studies — historical comparison */}
          <div className="bg-cream-50 rounded-2xl shadow-card border border-amber-100 p-4">
            <h2 className="text-xs font-semibold uppercase tracking-wide text-slate-750/60 mb-3">Prior Studies</h2>
            <div className="flex flex-col gap-2">
              {PRIOR_STUDIES.map((study) => {
                const active = comparisonStudyId === study.id;
                return (
                  <button
                    key={study.id}
                    onClick={() => setComparisonStudyId(active ? null : study.id)}
                    className={`flex items-center gap-3 text-left rounded-xl border p-2 transition-colors ${
                      active ? "border-amber-400 bg-amber-50" : "border-amber-100 bg-cream-100/40 hover:bg-amber-50/60"
                    }`}
                  >
                    <div className="w-14 h-14 rounded-lg overflow-hidden bg-slate-950 shrink-0 border border-slate-850">
                      {renderSyntheticXray(study.opacityLevel, `${study.id}-thumb`)}
                    </div>
                    <div className="min-w-0">
                      <p className="text-xs font-semibold text-slate-850">{study.label}</p>
                      <p className="text-[11px] text-slate-750/50">{study.date}</p>
                      <p className="text-[11px] text-slate-750/60 mt-0.5 leading-snug">{study.summary}</p>
                    </div>
                  </button>
                );
              })}
            </div>
            <p className="text-[11px] text-slate-750/45 mt-3 leading-snug">
              {comparisonStudy
                ? `Comparing against ${comparisonStudy.label}. Tap it again, or "Exit comparison" on the canvas, to return to the single view.`
                : "Tap a prior study to view it side-by-side with the current image."}
            </p>
          </div>

          {/* Model / audit trail */}
          <div className="bg-cream-50 rounded-2xl shadow-card border border-amber-100 p-4">
            <h2 className="text-xs font-semibold uppercase tracking-wide text-slate-750/60 mb-3">Inference Details</h2>
            <dl className="text-xs font-mono text-slate-750/75 space-y-1.5 leading-relaxed">
              <div className="flex justify-between gap-2"><dt className="text-slate-750/50">Model</dt><dd className="text-slate-850 text-right">PneumoNet-CXR v2.3</dd></div>
              <div className="flex justify-between gap-2"><dt className="text-slate-750/50">Runtime</dt><dd className="text-slate-850 text-right">Local ONNX · CPU</dd></div>
              <div className="flex justify-between gap-2"><dt className="text-slate-750/50">Run at</dt><dd className="text-slate-850 text-right">{runTimestamp.toLocaleString()}</dd></div>
              <div className="flex justify-between gap-2"><dt className="text-slate-750/50">Findings</dt><dd className="text-slate-850 text-right">{FINDINGS.length} detected</dd></div>
            </dl>
          </div>
        </aside>

        {/* ---------- MAIN VISUAL CANVAS ---------- */}
        <section className="flex flex-col gap-3 order-3 lg:order-2">

          <div className="flex flex-wrap items-center gap-2">
            {viewTabs.map((tab) => (
              <button
                key={tab.key}
                onClick={() => setActiveView(tab.key)}
                className={`px-4 py-2 rounded-lg text-sm font-semibold border transition-colors
                  ${activeView === tab.key
                    ? "bg-amber-500 border-amber-500 text-cream-50 shadow-sm"
                    : "bg-cream-50 border-amber-100 text-slate-750/75 hover:border-amber-300 hover:text-slate-850"}`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* Viewer toolbar: zoom, pan reset, window/level, heatmap opacity */}
          <div className="flex flex-wrap items-center gap-x-4 gap-y-2 bg-cream-50 border border-amber-100 rounded-xl px-3 py-2">
            <div className="flex items-center gap-1.5">
              <button onClick={() => setZoom((z) => clamp(+(z - 0.2).toFixed(2), 0.5, 3))}
                className="w-7 h-7 rounded-md border border-amber-200 text-slate-750 hover:bg-amber-50 font-semibold text-sm">−</button>
              <span className="text-xs font-mono w-11 text-center text-slate-750/70">{Math.round(zoom * 100)}%</span>
              <button onClick={() => setZoom((z) => clamp(+(z + 0.2).toFixed(2), 0.5, 3))}
                className="w-7 h-7 rounded-md border border-amber-200 text-slate-750 hover:bg-amber-50 font-semibold text-sm">+</button>
              <button onClick={resetView}
                className="ml-1 px-2 h-7 rounded-md border border-amber-200 text-slate-750 hover:bg-amber-50 text-xs font-semibold">Reset View</button>
            </div>

            <div className="h-5 w-px bg-amber-100 hidden sm:block" />

            <label className="flex items-center gap-2 text-xs text-slate-750/70">
              Brightness
              <input type="range" min="50" max="150" value={brightness}
                onChange={(e) => setBrightness(+e.target.value)} className="w-20 accent-amber-500" />
            </label>
            <label className="flex items-center gap-2 text-xs text-slate-750/70">
              Contrast
              <input type="range" min="50" max="150" value={contrast}
                onChange={(e) => setContrast(+e.target.value)} className="w-20 accent-amber-500" />
            </label>
            <button onClick={resetWindowLevel}
              className="px-2 h-7 rounded-md border border-amber-200 text-slate-750 hover:bg-amber-50 text-xs font-semibold">Reset W/L</button>

            {activeView === "gradcam" && (
              <>
                <div className="h-5 w-px bg-amber-100 hidden sm:block" />
                <label className="flex items-center gap-2 text-xs text-slate-750/70">
                  Heatmap opacity
                  <input type="range" min="10" max="100" value={heatmapOpacity}
                    onChange={(e) => setHeatmapOpacity(+e.target.value)} className="w-20 accent-amber-500" />
                </label>
              </>
            )}
          </div>

          {comparisonStudy ? (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 flex-1 min-h-[480px]">
              {/* Prior study panel (static — read-only reference) */}
              <div className="relative bg-slate-950 rounded-2xl shadow-card overflow-hidden border border-slate-850 flex flex-col">
                <div className="flex items-center justify-between px-3 py-2 border-b border-slate-850/70 shrink-0">
                  <span className="text-xs font-mono text-slate-400">{comparisonStudy.label} · {comparisonStudy.date}</span>
                  <span className="text-[10px] font-semibold uppercase tracking-wide text-slate-500">Prior</span>
                </div>
                <div className="flex-1 flex items-center justify-center p-3 min-h-0">
                  {renderSyntheticXray(comparisonStudy.opacityLevel, `${comparisonStudy.id}-panel`)}
                </div>
                <div className="px-3 py-2 border-t border-slate-850/70 shrink-0">
                  <p className="text-[11px] text-slate-300/75 leading-snug">{comparisonStudy.summary}</p>
                </div>
              </div>

              {/* Current study panel — same interactive viewer as single view */}
              <div className="relative bg-slate-950 rounded-2xl shadow-card overflow-hidden border border-slate-850 flex flex-col">
                <div className="flex items-center justify-between px-3 py-2 border-b border-slate-850/70 shrink-0">
                  <span className="text-xs font-mono text-slate-400">Current · Today</span>
                  <button onClick={() => setComparisonStudyId(null)}
                    className="text-[11px] font-semibold text-slate-400 hover:text-cream-50 transition-colors">
                    Exit comparison ✕
                  </button>
                </div>
                <div className="relative flex-1 min-h-0" onWheel={handleWheel}>
                  {renderInteractiveViewer()}
                  <span className="absolute top-2 left-2 text-[10px] font-mono text-slate-400/70 bg-slate-850/70 px-1.5 py-0.5 rounded">
                    {activeView === "original" && "RAW IMAGE"}
                    {activeView === "bbox" && `DETECTION · ${canvasFindings.length}`}
                    {activeView === "gradcam" && `GRAD-CAM · ${canvasFindings.length}`}
                  </span>
                </div>
              </div>
            </div>
          ) : (
            <div
              className="relative bg-slate-950 rounded-2xl shadow-card overflow-hidden flex-1 min-h-[480px] border border-slate-850"
              onWheel={handleWheel}
            >
              {renderInteractiveViewer()}

              <span className="absolute top-3 left-3 text-[11px] font-mono text-slate-400/70 bg-slate-850/70 px-2 py-1 rounded">
                {activeView === "original" && "VIEW: RAW IMAGE"}
                {activeView === "bbox" && `VIEW: DETECTION OVERLAY · ${canvasFindings.length} finding(s)`}
                {activeView === "gradcam" && `VIEW: GRAD-CAM ACTIVATION · ${canvasFindings.length} finding(s)`}
              </span>
              <span className="absolute bottom-3 right-3 text-[11px] font-mono text-slate-500/70">
                {imageUrl ? "uploaded study" : "1024×1024 · 12-bit · local inference"}
              </span>
            </div>
          )}

          {!comparisonStudy && activeView !== "original" && (
            <p className="text-xs text-slate-750/55 text-center">
              Click a highlighted region on the image, or a finding on the right, to inspect its evidence.
            </p>
          )}
        </section>

        {/* ---------- RIGHT ANALYTICS PANEL ---------- */}
        <aside className="flex flex-col gap-5 order-2 lg:order-3">

          {primaryFinding ? (
            <div className="rounded-2xl border border-crimson-500/30 bg-crimson-500/10 px-4 py-3.5 flex items-start gap-3 shadow-card">
              <span className="mt-0.5 w-2.5 h-2.5 rounded-full bg-crimson-500 alert-pulse shrink-0"></span>
              <div>
                <p className="text-sm font-semibold text-crimson-600 leading-snug">{primaryFinding.label}</p>
                <p className="text-xs text-crimson-600/75 mt-0.5">{primaryFinding.region} · high-priority flag</p>
              </div>
            </div>
          ) : (
            <div className="rounded-2xl border border-amber-200 bg-cream-50 px-4 py-3.5 flex items-start gap-3 shadow-card">
              <span className="mt-0.5 w-2.5 h-2.5 rounded-full bg-amber-400 shrink-0"></span>
              <div>
                <p className="text-sm font-semibold text-slate-850 leading-snug">No findings above threshold</p>
                <p className="text-xs text-slate-750/60 mt-0.5">Lower the confidence threshold to review borderline findings.</p>
              </div>
            </div>
          )}

          {/* Findings + threshold */}
          <div className="bg-cream-50 rounded-2xl shadow-card border border-amber-100 p-4">
            <div className="flex items-center justify-between mb-3">
              <h2 className="text-xs font-semibold uppercase tracking-wide text-slate-750/60">Detected Findings</h2>
              <span className="text-[11px] font-mono text-slate-750/50">{visibleFindings.length} of {FINDINGS.length} shown</span>
            </div>
            <label className="block mb-3">
              <span className="text-[11px] font-medium text-slate-750/55 uppercase tracking-wide">
                Confidence threshold: {confidenceThreshold}%
              </span>
              <input type="range" min="0" max="100" value={confidenceThreshold}
                onChange={(e) => setConfidenceThreshold(+e.target.value)}
                className="w-full mt-1.5 accent-amber-500" />
            </label>
            <div className="flex flex-col gap-2">
              {FINDINGS.map((f) => {
                const below = f.confidence < confidenceThreshold;
                const selected = activeFinding && activeFinding.id === f.id;
                return (
                  <button key={f.id}
                    onClick={() => setSelectedFindingId(f.id)}
                    className={`text-left rounded-lg border px-3 py-2 transition-colors ${
                      selected ? "border-amber-400 bg-amber-50" : "border-amber-100 bg-cream-100/50 hover:bg-amber-50/60"
                    } ${below ? "opacity-50" : ""}`}
                  >
                    <div className="flex items-center justify-between gap-2">
                      <div className="flex items-center gap-2 min-w-0">
                        <span className={`w-2 h-2 rounded-full shrink-0 ${SEVERITY_DOT[f.severity]}`}></span>
                        <span className="text-sm font-semibold text-slate-850 truncate">{f.label}</span>
                      </div>
                      <span className="text-xs font-mono text-slate-750/60 shrink-0">{f.confidence}%</span>
                    </div>
                    <p className="text-xs text-slate-750/55 mt-0.5">
                      {f.region}{below ? " · below threshold" : ""}
                    </p>
                  </button>
                );
              })}
            </div>
          </div>

          <div className="bg-cream-50 rounded-2xl shadow-card border border-amber-100 p-4">
            <h2 className="text-xs font-semibold uppercase tracking-wide text-slate-750/60 mb-3">Model Metrics</h2>
            <div className="flex items-center justify-around">
              <ProgressRing value={activeFinding ? activeFinding.confidence : 0} label={`${activeFinding ? activeFinding.label : "Selected"} Confidence`} tone="amber" />
              <ProgressRing value={94} label="Spatial Alignment Score" tone="sage" />
            </div>
          </div>

          <div className="bg-cream-50 rounded-2xl shadow-card border border-amber-100 p-4 flex flex-col min-h-[220px] max-h-[320px]">
            <h2 className="text-xs font-semibold uppercase tracking-wide text-slate-750/60 mb-1">Retrieved Medical Evidence</h2>
            <p className="text-[11px] text-slate-750/50 mb-3 truncate">for: {activeFinding ? activeFinding.label : "—"}</p>
            <div className="overflow-y-auto pr-1 text-sm text-slate-750/85 leading-relaxed space-y-3">
              {(activeFinding ? activeFinding.evidence : []).map((item, idx) => (
                <p key={idx}>
                  {item.url ? (
                    <a href={item.url} target="_blank" rel="noopener noreferrer"
                      className="font-semibold text-amber-700 hover:text-amber-800 underline underline-offset-2">
                      {item.source} ↗
                    </a>
                  ) : (
                    <>
                      <span className="font-semibold text-slate-850">{item.source}</span>
                      <span className="ml-1.5 text-[10px] font-semibold uppercase tracking-wide text-slate-750/40 align-middle">Internal</span>
                    </>
                  )}
                  {": "}{item.text}
                </p>
              ))}
            </div>
          </div>
        </aside>

        {/* ---------- BOTTOM REPORT EDITOR ---------- */}
        <section className="col-span-1 lg:col-span-3 order-4">
          <div className="bg-cream-50 rounded-2xl shadow-card border border-amber-100 p-5">
            <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
              <h2 className="font-serif text-base font-semibold text-slate-850">Draft Radiology Report</h2>
              <div className="flex items-center gap-3 flex-wrap">
                <button onClick={insertFindingsSummary}
                  className="text-xs font-semibold text-amber-700 hover:text-amber-800 underline underline-offset-2">
                  Insert Findings Summary
                </button>
                <button onClick={handleClearSavedData}
                  className="text-xs font-semibold text-slate-750/50 hover:text-crimson-600 underline underline-offset-2">
                  Clear saved draft
                </button>
                <span className={`text-[11px] font-mono uppercase tracking-wide ${getSaveLabelClass()}`}>{getSaveLabel()}</span>
              </div>
            </div>
            <textarea
              value={reportText}
              onChange={(e) => setReportText(e.target.value)}
              spellCheck="false"
              className="w-full min-h-[260px] bg-cream-100/60 border border-amber-100 rounded-xl px-4 py-4 text-sm leading-relaxed font-mono text-slate-850 focus:ring-2 focus:ring-amber-300 focus:border-amber-300 resize-y"
            />
          </div>
        </section>

        {/* ---------- CLINICIAN FEEDBACK LOG ---------- */}
        <section className="col-span-1 lg:col-span-3 order-5">
          <div className="bg-cream-50 rounded-2xl shadow-card border border-amber-100 p-5">
            <h2 className="font-serif text-base font-semibold text-slate-850 mb-3">Clinician Feedback Log</h2>
            {feedbackLog.length === 0 ? (
              <p className="text-sm text-slate-750/55">
                No feedback submitted yet. Feedback from "Edit Draft" or "Reject / Archive" is sent to the backend orchestrator and will appear here.
              </p>
            ) : (
              <div className="flex flex-col gap-2">
                {[...feedbackLog].reverse().map((entry) => (
                  <div key={entry.id} className="flex items-start gap-3 rounded-lg border border-amber-100 bg-cream-100/50 px-3 py-2">
                    <span className={`text-[10px] font-semibold uppercase tracking-wide px-2 py-0.5 rounded-full shrink-0 mt-0.5 ${
                      entry.type === "reject" ? "bg-crimson-500/15 text-crimson-600" : "bg-amber-500/15 text-amber-700"
                    }`}>
                      {entry.type === "reject" ? "Rejected" : "Revision"}
                    </span>
                    <div className="min-w-0">
                      <p className="text-sm text-slate-750/85 leading-snug">{entry.reason}</p>
                      <p className="text-[11px] text-slate-750/45 mt-0.5">{new Date(entry.timestamp).toLocaleString()}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </section>
      </main>

      {/* ---------------- FLOATING ACTION BAR ---------------- */}
      <div className="fixed bottom-6 right-6 z-40 flex items-center gap-3 bg-cream-50/95 backdrop-blur border border-amber-100 shadow-floating rounded-2xl px-4 py-3">
        {caseStatus && (
          <span className={`text-xs font-semibold px-2.5 py-1 rounded-full mr-1
            ${caseStatus === "approved" ? "bg-sage-500/15 text-sage-600" : "bg-crimson-500/15 text-crimson-600"}`}>
            {caseStatus === "approved" ? "Finalized" : "Archived"}
          </span>
        )}
        <button
          onClick={() => setFeedbackRequest("revise")}
          className="px-4 py-2 rounded-lg text-sm font-semibold bg-cream-100 text-slate-750 border border-amber-100 hover:bg-amber-50 transition-colors"
        >
          Edit Draft
        </button>
        <button
          onClick={() => setFeedbackRequest("reject")}
          className="px-4 py-2 rounded-lg text-sm font-semibold bg-crimson-500 text-cream-50 hover:bg-crimson-600 transition-colors shadow-sm"
        >
          Reject / Archive Case
        </button>
        <button
          onClick={() => setPendingAction("approve")}
          className="px-4 py-2 rounded-lg text-sm font-semibold bg-sage-500 text-cream-50 hover:bg-sage-600 transition-colors shadow-sm"
        >
          Approve & Finalize
        </button>
      </div>

      <ConfirmModal
        pendingAction={pendingAction}
        onConfirm={handleConfirmAction}
        onCancel={() => setPendingAction(null)}
      />
      <FeedbackModal
        requestType={feedbackRequest}
        value={feedbackText}
        onChange={setFeedbackText}
        onSubmit={handleSubmitFeedback}
        onCancel={handleCancelFeedback}
      />
      <Toast toast={toast} />
    </div>
  );
}

try {
  const rootEl = document.getElementById("root");
  ReactDOM.createRoot(rootEl).render(<App />);
  rootEl.dataset.mounted = "true";
} catch (err) {
  console.error("Failed to mount App:", err);
  const rootEl = document.getElementById("root");
  rootEl.innerHTML =
    '<div style="max-width:640px;margin:60px auto;padding:24px;font-family:sans-serif;' +
    'background:#FBF3E7;border:1px solid #E0AD73;border-radius:12px;color:#2A2F3A;">' +
    '<h2 style="margin:0 0 8px;font-size:16px;color:#8E2D3D;">Console failed to render</h2>' +
    '<p style="margin:0;font-size:13px;line-height:1.5;">' + String(err && err.message ? err.message : err) + '</p>' +
    '</div>';
}
</script>
</body>
</html>
